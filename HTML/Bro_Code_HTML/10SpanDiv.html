<!DOCTYPE html>
<html>
<head>
    <title>Span And Div</title>
</head>
<body>

    <!--Span - adds markup to text or portion of a Document-->
    <!--Div - defines a division of a document-->

    <h1>Sections</h1>

    <p>
        Section 1 This is the Section One <span style="color: blue;">Marked the sentence</span>
    </p>

    <div style="color: rgb(252, 51, 1);">
    <p>
        Section 2 This is the Section Two with Div Tag
    </p>
    </div>

    <p>
        Section 3 This is the Section Three
    </p>

    <div style="background-color: rgb(7, 243, 70);width: 300px;height: 100px;;">
        <p>
            Section 4 This is the Section Four
        </p>
    </div>
    
</body>
</html>
