<!doctype html>
<html>
  <head>
    <title>Images</title>
  </head>
  <body>
    
    <!-- The height are weight are attibutes in pixels px -->
    <!-- A title will be a small pop-ip box that apperas when you hover cursor over an image -->

    <h3>Just Image</h3>
    <img
      src="./Attachments/Image1.png"
      width="400"
      height="240"
      alt="A Donut Image"
      title="A White donut image with blue backgroud"
    />

    <br />
    <h3>Image as a Hyperlinks</h3>
    <a href="https://en.wikipedia.org/wiki/Doughnut">
        <img
        src="./Attachments/Image1.png"
        width="400"
        height="240"
        alt="A Donut Image"
        title="A White donut image with blue backgroud"
        />
    </a>
  </body>
</html>
