<!DOCTYPE html>
<html>
<head>
    <title>Text Formatting</title>
</head>
<body>

    <p>The Normal Sentence</p>
    <p><b>Make the Sentence in Bold</b></p>
    <p><i>Make the Sentence in Italics</i></p>
    <p><big>Make the Sentence Bigger</big></p>
    <p><small>Make the Sentence Smaller</small></p>
    <p>Make Sentence  in <sub>Subscript(Base)</sub></p>
    <p>Make Sentence in <sup>Superscript(Power)</sup></p>
    <p><ins>Make Sentence Inserted(Underline)</ins></p>
    <p><del>Make Sentence Deleted</del></p>
    <p><mark>Make Sentence Marked<mark></p>

</body>
</html>
