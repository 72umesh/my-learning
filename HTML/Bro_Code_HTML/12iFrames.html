<!DOCTYPE html>
<html>
<head>
    <title>iFrames</title>
</head>
<body>

    <!-- iframe- embed content from another source into a html document
      ex. used in ads,used in many hacking technique
      Using iframes we can embed another webpage in a webpage-->

    <iframe src="https://www.bing.com" frameborder="0" width="500" height="200"></iframe>
    
    <!-- iframe to add an document -->
    <iframe style="border:0;"src="3Images.html" width="500" height="500"></iframe>
</body>
</html>
