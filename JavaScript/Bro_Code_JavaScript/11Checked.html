<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checked property</title>
    <style>
        body{
            font-size: 1.5em;
        }
        #mySubmit{
            font-size: 0.8em;
        }
    </style>
</head>
<body>

    <input type="checkbox" id="myCheckBox">
    <label for="myCheckBox">Subscribed</label><br><br>

    <input type="radio" id="visaBtn" name="Cards">
    <label for="visaBtn">Visa</label><br>
    <input type="radio" id="masterCardBtn" name="Cards">
    <label for="masterCardBtn">MasterCard</label><br>
    <input type="radio" id="payPalBtn" name="Cards">
    <label for="payPalBtn">Paypal</label><br><br>

    <button type="submit" id="mySubmit">Submit</button><br>

    <p id="subResult"></p>
    <p id="cardResult"></p>

    <script src="11Checked.js"></script>
    
</body>
</html>
